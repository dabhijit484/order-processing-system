services:
  postgres:
    image: postgres:16-alpine
    container_name: order-processing-postgres
    environment:
      POSTGRES_DB: order_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  order-process-service:
    build:
      context: ./order-process-service
    container_name: order-process-service
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

  order-process-ui:
    build:
      context: ./order-process-ui
    depends_on:
      - order-process-service
    ports:
      - "4173:80"

volumes:
  postgres-data:
